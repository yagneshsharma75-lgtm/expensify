<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             viewport-fit=cover">

<title>Expensify — Login</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com">

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
}

body {

    min-height: 100svh;

    display: grid;
    place-items: center;

    padding:
        calc(20px + env(safe-area-inset-top))
        18px
        calc(20px + env(safe-area-inset-bottom));

    font-family: "Inter", sans-serif;

    color: white;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(59,130,246,.20),
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(139,92,246,.18),
            transparent 35%
        ),
        #070b14;
}

/* BACKGROUND */

.background {
    position: fixed;
    inset: 0;

    overflow: hidden;
    pointer-events: none;
}

.background span {
    position: absolute;

    width: 220px;
    height: 220px;

    border-radius: 50%;

    filter: blur(90px);

    opacity: .2;
}

.background span:first-child {
    background: #2563eb;

    top: -80px;
    left: -70px;
}

.background span:last-child {
    background: #7c3aed;

    right: -70px;
    bottom: -80px;
}

/* LOGIN CARD */

.login-box {

    position: relative;
    z-index: 2;

    width: 100%;
    max-width: 390px;

    padding: 30px 22px;

    border-radius: 24px;

    background: rgba(17,24,39,.82);

    border: 1px solid rgba(255,255,255,.08);

    box-shadow:
        0 25px 70px rgba(0,0,0,.45);

    backdrop-filter: blur(25px);

    text-align: center;
}

/* LOGO */

.logo {

    font-size: 27px;
    font-weight: 800;

    letter-spacing: -1px;

    margin-bottom: 9px;

    background:
        linear-gradient(
            100deg,
            #60a5fa,
            #818cf8,
            #c084fc
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}

.subtitle {

    color: #94a3b8;

    font-size: 13px;
    line-height: 1.5;

    margin-bottom: 26px;
}

/* INPUTS */

.input-group {

    width: 100%;
    text-align: left;

    margin-bottom: 13px;
}

.input-group label {

    display: block;

    color: #94a3b8;

    font-size: 12px;
    font-weight: 500;

    margin-bottom: 7px;
}

.input-group input {

    display: block;

    width: 100%;
    height: 50px;

    padding: 0 15px;

    border: 1px solid rgba(255,255,255,.08);

    border-radius: 13px;

    outline: none;

    background: rgba(255,255,255,.055);

    color: white;

    font-size: 15px;

    transition: .2s;
}

.input-group input::placeholder {
    color: #64748b;
}

.input-group input:focus {

    border-color: rgba(96,165,250,.7);

    background: rgba(255,255,255,.075);

    box-shadow:
        0 0 0 3px rgba(59,130,246,.10);
}

/* LOGIN BUTTON */

.login-button {

    width: 100%;
    height: 51px;

    margin-top: 8px;

    border: none;
    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #3b82f6,
            #6366f1
        );

    color: white;

    font-size: 15px;
    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 12px 25px rgba(59,130,246,.22);
}

/* ERROR */

#error {

    min-height: 18px;

    margin-top: 12px;

    color: #f87171;

    font-size: 12px;
}

/* FOOTER */

.footer {

    margin-top: 22px;

    color: #64748b;

    font-size: 11px;
}

/* SMALL PHONES */

@media (max-height: 650px) {

    .login-box {
        padding: 22px 20px;
    }

    .logo {
        font-size: 24px;
    }

    .subtitle {
        margin-bottom: 18px;
    }

    .input-group {
        margin-bottom: 9px;
    }

    .input-group input {
        height: 46px;
    }

    .login-button {
        height: 47px;
    }

    .footer {
        margin-top: 14px;
    }
}

</style>

</head>

<body>

<div class="background">
    <span></span>
    <span></span>
</div>

<div class="login-box">

    <div class="logo">
        💰 Expensify
    </div>

    <p class="subtitle">
        Welcome back — manage your finances smarter
    </p>

    <div class="input-group">

        <label>
            Username
        </label>

        <input
            id="user"
            type="text"
            autocomplete="username"
            placeholder="Enter username">

    </div>

    <div class="input-group">

        <label>
            Password
        </label>

        <input
            id="pass"
            type="password"
            autocomplete="current-password"
            placeholder="Enter password">

    </div>

    <button
        class="login-button"
        onclick="login()">

        Login →

    </button>

    <p id="error"></p>

    <div class="footer">
        Expensify • Personal Finance
    </div>

</div>

<script>

function login() {

    const username =
        document.getElementById("user")
        .value
        .trim();

    const password =
        document.getElementById("pass")
        .value
        .trim();

    const error =
        document.getElementById("error");

    if (
        username === "admin" &&
        password === "1234"
    ) {

        localStorage.setItem(
            "username",
            username
        );

        localStorage.setItem(
            "auth",
            "true"
        );

        window.location.href =
            "dashboard.html";

    } else {

        error.innerText =
            "Invalid username or password";

    }

}

/* Allow Enter key to login */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            login();
        }

    }
);

</script>

</body>
</html>
