<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login • Expensify</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
    background:#07111f;
    color:#fff;
    min-height:100svh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding:
        max(20px, env(safe-area-inset-top))
        20px
        max(20px, env(safe-area-inset-bottom));
}

/* Background */
body::before{
    content:"";
    position:fixed;
    width:420px;
    height:420px;
    background:#2563eb;
    filter:blur(140px);
    opacity:.18;
    top:-180px;
    right:-180px;
    border-radius:50%;
}

body::after{
    content:"";
    position:fixed;
    width:350px;
    height:350px;
    background:#06b6d4;
    filter:blur(150px);
    opacity:.10;
    bottom:-180px;
    left:-160px;
    border-radius:50%;
}

/* Main */
.login-wrapper{
    width:100%;
    max-width:390px;
    position:relative;
    z-index:2;
}

/* Logo */
.brand{
    text-align:center;
    margin-bottom:32px;
}

.logo{
    width:54px;
    height:54px;
    margin:0 auto 16px;
    border-radius:17px;
    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(135deg,#3b82f6,#06b6d4);
    box-shadow:
        0 12px 35px rgba(37,99,235,.30),
        inset 0 1px 1px rgba(255,255,255,.3);

    font-size:25px;
    font-weight:800;
}

.brand h1{
    font-size:27px;
    letter-spacing:-1px;
    font-weight:750;
}

.brand p{
    color:#8190a5;
    font-size:14px;
    margin-top:7px;
}

/* Login box */
.login-box{
    background:rgba(15,25,40,.82);
    border:1px solid rgba(255,255,255,.08);
    border-radius:25px;
    padding:28px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.35),
        inset 0 1px rgba(255,255,255,.04);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
}

.login-title{
    margin-bottom:23px;
}

.login-title h2{
    font-size:21px;
    font-weight:700;
    letter-spacing:-.4px;
}

.login-title p{
    color:#77869b;
    font-size:13px;
    margin-top:6px;
}

/* Inputs */
.field{
    margin-bottom:16px;
}

.field label{
    display:block;
    color:#9aa8bb;
    font-size:12px;
    font-weight:600;
    margin-bottom:8px;
}

.input{
    width:100%;
    height:52px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.08);
    outline:none;

    background:#0a1525;
    color:white;

    padding:0 15px;
    font-size:15px;

    transition:.2s;
}

.input::placeholder{
    color:#526176;
}

.input:focus{
    border-color:#3b82f6;
    box-shadow:0 0 0 3px rgba(59,130,246,.12);
}

/* Button */
.login-btn{
    width:100%;
    height:52px;
    margin-top:6px;

    border:none;
    border-radius:14px;

    background:linear-gradient(135deg,#3b82f6,#2563eb);
    color:white;

    font-size:15px;
    font-weight:700;

    cursor:pointer;

    box-shadow:0 10px 25px rgba(37,99,235,.25);
    transition:.2s;
}

.login-btn:active{
    transform:scale(.98);
}

/* Error */
#error{
    min-height:18px;
    text-align:center;
    color:#fb7185;
    font-size:12px;
    margin-top:13px;
}

/* Demo */
.demo{
    margin-top:20px;
    padding-top:18px;
    border-top:1px solid rgba(255,255,255,.06);
    text-align:center;
}

.demo span{
    color:#65748a;
    font-size:11px;
}

.demo strong{
    color:#aeb9c9;
    font-weight:600;
}

/* Back */
.back{
    display:block;
    text-align:center;
    margin-top:22px;

    color:#64748b;
    text-decoration:none;
    font-size:13px;
}

.back:hover{
    color:#aab6c7;
}

/* Desktop */
@media(min-width:700px){
    .login-box{
        padding:32px;
    }
}

/* Small phones */
@media(max-height:650px){
    .brand{
        margin-bottom:18px;
    }

    .logo{
        width:45px;
        height:45px;
        margin-bottom:9px;
        border-radius:14px;
        font-size:20px;
    }

    .brand h1{
        font-size:23px;
    }

    .login-box{
        padding:22px;
    }

    .field{
        margin-bottom:11px;
    }

    .input,
    .login-btn{
        height:48px;
    }
}
</style>
</head>

<body>

<div class="login-wrapper">

    <div class="brand">
        <div class="logo">₹</div>
        <h1>Expensify</h1>
        <p>Your money, organized.</p>
    </div>

    <div class="login-box">

        <div class="login-title">
            <h2>Welcome back</h2>
            <p>Sign in to continue to your dashboard.</p>
        </div>

        <div class="field">
            <label>USERNAME</label>
            <input
                id="user"
                class="input"
                type="text"
                placeholder="Enter your username"
                autocomplete="username"
            >
        </div>

        <div class="field">
            <label>PASSWORD</label>
            <input
                id="pass"
                class="input"
                type="password"
                placeholder="Enter your password"
                autocomplete="current-password"
            >
        </div>

        <button class="login-btn" onclick="login()">
            Sign in
        </button>

        <div id="error"></div>

        <div class="demo">
            <span>Demo account · </span>
            <strong>admin / 1234</strong>
        </div>

    </div>

    <a class="back" href="index.html">← Back to Expensify</a>

</div>

<script>
function login(){

    const username = document.getElementById("user").value.trim();
    const password = document.getElementById("pass").value.trim();
    const error = document.getElementById("error");

    if(username === "admin" && password === "1234"){

        localStorage.setItem("username", username);
        localStorage.setItem("auth", "true");

        window.location.href = "dashboard.html";

    }else{

        error.textContent = "Incorrect username or password";

    }
}

document.addEventListener("keydown", function(e){
    if(e.key === "Enter"){
        login();
    }
});
</script>

</body>
</html>
